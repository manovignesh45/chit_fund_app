services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chit-fund-app:latest
    ports:
      - "9693:3001"  # host 9693 -> container 3001
    # Runtime env only (DATABASE_URL, JWT_SECRET, INTERNAL_API_KEY, ADMIN_EMAIL, SMTP_*).
    env_file:
      - .env
    environment:
      NODE_ENV: production  # wins over a NODE_ENV=development line in .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M